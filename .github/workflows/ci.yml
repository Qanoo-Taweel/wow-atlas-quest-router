name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 (the WoW client's Lua)
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Lua tests (ATLAS == Atlas.java, planner, patterns, facade)
        run: lua5.1 tests/run.lua
      - name: Website data is up to date
        run: |
          lua5.1 tools/export_web_data.lua
          git diff --exit-code docs/assets/data.js tests/fixtures/parity.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Website ATLAS == addon ATLAS
        run: node tests/parity.mjs
